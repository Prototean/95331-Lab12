#spring.application.name=331-backend

spring:
  application:
    name: 331-backend
  mvc:
    problemdetails:
      enabled: true
  profiles:
    active:
      - db
      - local
  datasource:
    url: jdbc:postgresql://localhost:5432/selabdb
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: create
  servlet:
    multipart:
      max-file-size: 10MB